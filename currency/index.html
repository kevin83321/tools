<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Currency Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: transparent;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #37352f;
    }

    body {
      padding: 12px;
    }

    /* ================================
       Main Card
       ================================ */

    .converter {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;
      padding: 22px;

      background: #ffffff;

      border: 1px solid rgba(55, 53, 47, 0.12);
      border-radius: 12px;

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.04),
        0 4px 12px rgba(0, 0, 0, 0.03);
    }

    .title {
      margin-bottom: 22px;

      font-size: 20px;
      font-weight: 700;
    }

    /* ================================
       Form
       ================================ */

    .label {
      display: block;

      margin-bottom: 6px;

      color: #787774;

      font-size: 13px;
      font-weight: 500;
    }

    input,
    select {
      width: 100%;
      height: 50px;

      padding: 0 14px;

      background: #ffffff;
      color: #37352f;

      border: 1px solid rgba(55, 53, 47, 0.16);
      border-radius: 8px;

      outline: none;

      font-size: 16px;

      transition: 0.15s;
    }

    input:focus,
    select:focus {
      border-color: #9b9a97;

      box-shadow:
        0 0 0 2px rgba(55, 53, 47, 0.06);
    }

    .currency-row {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        50px
        minmax(0, 1fr);

      align-items: end;

      gap: 12px;

      margin-top: 18px;
    }

    /* ================================
       Swap button
       ================================ */

    .swap-button {
      width: 50px;
      height: 50px;

      border: none;
      border-radius: 8px;

      background: #f1f1ef;
      color: #37352f;

      font-size: 25px;

      cursor: pointer;

      transition: 0.15s;
    }

    .swap-button:hover {
      background: #e7e7e5;
    }

    .swap-button:active {
      transform: scale(0.96);
    }

    /* ================================
       Result
       ================================ */

    .result {
      margin-top: 24px;
      padding: 22px 16px;

      min-height: 160px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: #f7f7f5;

      border-radius: 9px;

      text-align: center;
    }

    .result-label {
      margin-bottom: 10px;

      color: #787774;

      font-size: 13px;
    }

    .result-value {
      font-size: 30px;
      font-weight: 700;

      word-break: break-word;
    }

    .rate {
      margin-top: 10px;

      color: #787774;

      font-size: 14px;
    }

    .meta {
      margin-top: 6px;

      color: #9b9a97;

      font-size: 11px;
    }

    /* ================================
       Refresh
       ================================ */

    .refresh-button {
      width: 100%;
      height: 46px;

      margin-top: 18px;

      border: none;
      border-radius: 8px;

      background: #37352f;
      color: #ffffff;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.15s;
    }

    .refresh-button:hover {
      background: #2f2e2a;
    }

    .refresh-button:active {
      transform: scale(0.99);
    }

    .refresh-button:disabled {
      opacity: 0.6;

      cursor: wait;
    }

    /* ================================
       Error
       ================================ */

    .error {
      min-height: 18px;

      margin-top: 12px;

      color: #d44c47;

      font-size: 12px;

      text-align: center;
    }

    /* ================================
       Mobile / narrow Notion block
       ================================ */

    @media (max-width: 500px) {

      body {
        padding: 6px;
      }

      .converter {
        padding: 16px;
      }

      .currency-row {
        grid-template-columns: 1fr;
      }

      .swap-button {
        width: 100%;
        height: 40px;
      }

      .result-value {
        font-size: 26px;
      }
    }
  </style>
</head>


<body>

<div class="converter">

  <div class="title">
    💱 Currency Converter
  </div>


  <!-- Amount -->

  <label
    class="label"
    for="amount"
  >
    Amount
  </label>

  <input
    id="amount"
    type="number"
    value="1000"
    min="0"
    step="any"
    inputmode="decimal"
    autocomplete="off"
  />


  <!-- Currency selection -->

  <div class="currency-row">

    <div>

      <label
        class="label"
        for="fromCurrency"
      >
        From
      </label>

      <select id="fromCurrency">

        <option value="TWD">
          TWD - New Taiwan Dollar
        </option>

        <option value="USD">
          USD - US Dollar
        </option>

        <option value="JPY">
          JPY - Japanese Yen
        </option>

        <option value="EUR">
          EUR - Euro
        </option>

        <option value="HKD">
          HKD - Hong Kong Dollar
        </option>

        <option value="MOP">
          MOP - Macanese Pataca
        </option>

        <option value="CNY">
          CNY - Chinese Yuan
        </option>

        <option value="KRW">
          KRW - South Korean Won
        </option>

        <option value="GBP">
          GBP - British Pound
        </option>

        <option value="SGD">
          SGD - Singapore Dollar
        </option>

        <option value="AUD">
          AUD - Australian Dollar
        </option>

        <option value="CAD">
          CAD - Canadian Dollar
        </option>

        <option value="THB">
          THB - Thai Baht
        </option>

        <option value="MYR">
          MYR - Malaysian Ringgit
        </option>

      </select>

    </div>


    <button
      class="swap-button"
      id="swapButton"
      type="button"
      title="Swap currencies"
    >
      ⇄
    </button>


    <div>

      <label
        class="label"
        for="toCurrency"
      >
        To
      </label>

      <select id="toCurrency">

        <option value="TWD">
          TWD - New Taiwan Dollar
        </option>

        <option value="USD">
          USD - US Dollar
        </option>

        <option value="JPY">
          JPY - Japanese Yen
        </option>

        <option value="EUR">
          EUR - Euro
        </option>

        <option value="HKD">
          HKD - Hong Kong Dollar
        </option>

        <option value="MOP">
          MOP - Macanese Pataca
        </option>

        <option value="CNY">
          CNY - Chinese Yuan
        </option>

        <option value="KRW">
          KRW - South Korean Won
        </option>

        <option value="GBP">
          GBP - British Pound
        </option>

        <option value="SGD">
          SGD - Singapore Dollar
        </option>

        <option value="AUD">
          AUD - Australian Dollar
        </option>

        <option value="CAD">
          CAD - Canadian Dollar
        </option>

        <option value="THB">
          THB - Thai Baht
        </option>

        <option value="MYR">
          MYR - Malaysian Ringgit
        </option>

      </select>

    </div>

  </div>


  <!-- Result -->

  <div class="result">

    <div class="result-label">
      Converted Amount
    </div>

    <div
      class="result-value"
      id="resultValue"
    >
      --
    </div>

    <div
      class="rate"
      id="rateValue"
    >
      --
    </div>

    <div
      class="meta"
      id="updateTime"
    >
      --
    </div>

  </div>


  <!-- Refresh -->

  <button
    class="refresh-button"
    id="refreshButton"
    type="button"
  >
    ↻ Refresh Rate
  </button>


  <!-- Error -->

  <div
    class="error"
    id="errorMessage"
  ></div>

</div>


<script>

  /*
   * ==========================================
   * Configuration
   * ==========================================
   */

  const API_BASE =
    "https://open.er-api.com/v6/latest";


  /*
   * Currency symbols
   */

  const currencySymbols = {

    TWD: "NT$",
    USD: "$",
    JPY: "¥",
    EUR: "€",
    HKD: "HK$",
    MOP: "MOP$",
    CNY: "CN¥",
    KRW: "₩",
    GBP: "£",
    SGD: "S$",
    AUD: "A$",
    CAD: "C$",
    THB: "฿",
    MYR: "RM"

  };


  /*
   * ==========================================
   * Elements
   * ==========================================
   */

  const amountInput =
    document.getElementById("amount");

  const fromCurrency =
    document.getElementById("fromCurrency");

  const toCurrency =
    document.getElementById("toCurrency");

  const resultValue =
    document.getElementById("resultValue");

  const rateValue =
    document.getElementById("rateValue");

  const updateTime =
    document.getElementById("updateTime");

  const refreshButton =
    document.getElementById("refreshButton");

  const swapButton =
    document.getElementById("swapButton");

  const errorMessage =
    document.getElementById("errorMessage");


  /*
   * ==========================================
   * Formatting
   * ==========================================
   */

  function formatAmount(value) {

    return new Intl.NumberFormat(
      "zh-TW",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    ).format(value);

  }


  function formatRate(value) {

    /*
     * 小匯率需要更多小數位，
     * 例如 KRW -> TWD。
     */

    let digits = 6;

    if (value >= 100) {
      digits = 2;
    }
    else if (value >= 1) {
      digits = 4;
    }

    return new Intl.NumberFormat(
      "zh-TW",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: digits
      }
    ).format(value);

  }


  /*
   * ==========================================
   * Save user preference
   * ==========================================
   */

  function saveSettings() {

    try {

      localStorage.setItem(
        "currencyConverterFrom",
        fromCurrency.value
      );

      localStorage.setItem(
        "currencyConverterTo",
        toCurrency.value
      );

    }
    catch (error) {

      /*
       * localStorage may be unavailable
       * inside some embedded environments.
       */

      console.warn(
        "Unable to save settings:",
        error
      );

    }

  }


  function loadSettings() {

    try {

      const savedFrom =
        localStorage.getItem(
          "currencyConverterFrom"
        );

      const savedTo =
        localStorage.getItem(
          "currencyConverterTo"
        );


      if (savedFrom) {
        fromCurrency.value = savedFrom;
      }
      else {
        fromCurrency.value = "TWD";
      }


      if (savedTo) {
        toCurrency.value = savedTo;
      }
      else {
        toCurrency.value = "USD";
      }

    }
    catch (error) {

      fromCurrency.value = "TWD";
      toCurrency.value = "USD";

    }

  }


  /*
   * ==========================================
   * Set loading state
   * ==========================================
   */

  function setLoading(loading) {

    refreshButton.disabled = loading;


    if (loading) {

      refreshButton.textContent =
        "Updating...";

    }
    else {

      refreshButton.textContent =
        "↻ Refresh Rate";

    }

  }


  /*
   * ==========================================
   * Convert
   * ==========================================
   */

  async function convertCurrency() {

    const amount =
      parseFloat(amountInput.value);

    const from =
      fromCurrency.value;

    const to =
      toCurrency.value;


    errorMessage.textContent = "";


    /*
     * Validate amount
     */

    if (
      Number.isNaN(amount) ||
      amount < 0
    ) {

      resultValue.textContent = "--";
      rateValue.textContent = "--";
      updateTime.textContent = "--";

      errorMessage.textContent =
        "請輸入有效金額";

      return;

    }


    /*
     * Same currency
     */

    if (from === to) {

      resultValue.textContent =
        `${currencySymbols[to] ?? to} ${formatAmount(amount)}`;

      rateValue.textContent =
        `1 ${from} = 1 ${to}`;

      updateTime.textContent =
        "Same currency";

      saveSettings();

      return;

    }


    setLoading(true);


    try {

      /*
       * Example:
       *
       * https://open.er-api.com/v6/latest/TWD
       */

      const url =
        `${API_BASE}/${encodeURIComponent(from)}`;


      const response =
        await fetch(
          url,
          {
            method: "GET",

            cache: "no-store",

            headers: {
              "Accept": "application/json"
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          `HTTP error ${response.status}`
        );

      }


      const data =
        await response.json();


      /*
       * API result validation
       */

      if (
        data.result &&
        data.result !== "success"
      ) {

        throw new Error(
          data["error-type"] ||
          "Exchange rate API returned an error"
        );

      }


      if (!data.rates) {

        throw new Error(
          "API response does not contain rates"
        );

      }


      const rate =
        data.rates[to];


      if (
        rate === undefined ||
        rate === null
      ) {

        throw new Error(
          `${to} is not available`
        );

      }


      /*
       * Conversion
       */

      const converted =
        amount * rate;


      /*
       * Result
       */

      const symbol =
        currencySymbols[to] ?? to;


      resultValue.textContent =
        `${symbol} ${formatAmount(converted)}`;


      /*
       * Exchange rate
       */

      rateValue.textContent =
        `1 ${from} = ${formatRate(rate)} ${to}`;


      /*
       * Last API update
       */

      if (data.time_last_update_utc) {

        const date =
          new Date(
            data.time_last_update_utc
          );


        if (!Number.isNaN(date.getTime())) {

          updateTime.textContent =
            `Rate updated: ${date.toLocaleString(
              "zh-TW",
              {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
              }
            )}`;

        }
        else {

          updateTime.textContent =
            data.time_last_update_utc;

        }

      }
      else {

        /*
         * Browser refresh time fallback
         */

        updateTime.textContent =
          `Refreshed: ${new Date().toLocaleString(
            "zh-TW"
          )}`;

      }


      /*
       * Save selections
       */

      saveSettings();

    }
    catch (error) {

      console.error(
        "Currency converter error:",
        error
      );


      resultValue.textContent =
        "--";

      rateValue.textContent =
        "--";

      updateTime.textContent =
        "--";


      errorMessage.textContent =
        `無法取得 ${from} → ${to} 匯率，請稍後再試。`;

    }
    finally {

      setLoading(false);

    }

  }


  /*
   * ==========================================
   * Swap currencies
   * ==========================================
   */

  function swapCurrencies() {

    const oldFrom =
      fromCurrency.value;

    fromCurrency.value =
      toCurrency.value;

    toCurrency.value =
      oldFrom;


    saveSettings();

    convertCurrency();

  }


  /*
   * ==========================================
   * Debounce amount input
   * ==========================================
   */

  let inputTimer = null;


  function scheduleConversion() {

    clearTimeout(inputTimer);


    inputTimer =
      setTimeout(
        () => {

          convertCurrency();

        },
        400
      );

  }


  /*
   * ==========================================
   * Events
   * ==========================================
   */

  refreshButton.addEventListener(
    "click",
    () => {

      convertCurrency();

    }
  );


  swapButton.addEventListener(
    "click",
    () => {

      swapCurrencies();

    }
  );


  fromCurrency.addEventListener(
    "change",
    () => {

      saveSettings();

      convertCurrency();

    }
  );


  toCurrency.addEventListener(
    "change",
    () => {

      saveSettings();

      convertCurrency();

    }
  );


  amountInput.addEventListener(
    "input",
    () => {

      scheduleConversion();

    }
  );


  amountInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        clearTimeout(inputTimer);

        convertCurrency();

      }

    }
  );


  /*
   * ==========================================
   * Start
   * ==========================================
   */

  loadSettings();

  convertCurrency();

</script>

</body>
</html>
