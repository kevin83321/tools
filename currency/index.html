<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Currency Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    color: #37352f;
}

body {
    padding: 12px;
}

.app {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;

    background: #fff;
    border: 1px solid rgba(55,53,47,.12);
    border-radius: 12px;

    padding: 22px;
}

.title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 22px;
}

/* ============================
   Two Columns
============================ */

.columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
}

.panel {
    min-width: 0;
}

.left-panel {
    padding-right: 28px;
    border-right: 1px solid #e9e9e7;
}

.panel-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 18px;
}

/* ============================
   Common controls
============================ */

.label {
    display: block;
    font-size: 12px;
    color: #787774;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    height: 44px;

    padding: 0 12px;

    border: 1px solid rgba(55,53,47,.16);
    border-radius: 7px;

    background: #fff;
    color: #37352f;

    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #9b9a97;
    box-shadow: 0 0 0 2px rgba(55,53,47,.06);
}

button {
    font-family: inherit;
}

/* ============================
   Converter
============================ */

.currency-row {
    display: grid;
    grid-template-columns: 1fr 44px 1fr;
    gap: 10px;

    margin-top: 16px;

    align-items: end;
}

.swap-button {
    width: 44px;
    height: 44px;

    border: 0;
    border-radius: 7px;

    background: #f1f1ef;

    font-size: 20px;
    cursor: pointer;
}

.swap-button:hover {
    background: #e7e7e5;
}

.result {
    margin-top: 20px;
    padding: 20px 15px;

    min-height: 135px;

    background: #f7f7f5;
    border-radius: 8px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    text-align: center;
}

.result-label {
    font-size: 12px;
    color: #787774;
}

.result-value {
    margin-top: 8px;

    font-size: 28px;
    font-weight: 700;

    word-break: break-word;
}

.rate {
    margin-top: 8px;

    font-size: 13px;
    color: #787774;
}

.refresh-button {
    width: 100%;
    height: 43px;

    margin-top: 15px;

    border: 0;
    border-radius: 7px;

    background: #37352f;
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

.refresh-button:hover {
    background: #2f2e2a;
}

.refresh-button:disabled {
    opacity: .55;
    cursor: wait;
}

/* ============================
   Favorite rates
============================ */

.favorite-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.favorite-item {
    display: grid;

    grid-template-columns:
        minmax(0,1fr)
        auto
        minmax(0,1fr)
        minmax(85px,auto)
        30px;

    align-items: center;

    gap: 7px;

    min-height: 48px;

    padding: 7px 8px;

    border: 1px solid #eeeeec;
    border-radius: 8px;

    background: #fff;
}

.favorite-item select {
    height: 34px;
    padding: 0 6px;

    font-size: 12px;
}

.arrow {
    color: #9b9a97;
    font-size: 13px;
}

.favorite-rate {
    text-align: right;

    font-size: 14px;
    font-weight: 600;

    white-space: nowrap;
}

.delete-button {
    width: 30px;
    height: 30px;

    border: 0;
    border-radius: 5px;

    background: transparent;
    color: #9b9a97;

    font-size: 18px;

    cursor: pointer;
}

.delete-button:hover {
    background: #f1f1ef;
    color: #d44c47;
}

/* ============================
   Add
============================ */

.add-button {
    width: 100%;
    height: 40px;

    margin-top: 12px;

    border: 1px dashed #c9c9c6;
    border-radius: 7px;

    background: transparent;

    color: #787774;

    cursor: pointer;
}

.add-button:hover {
    background: #f7f7f5;
}

/* ============================
   Meta
============================ */

.favorite-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-top: 14px;

    font-size: 11px;
    color: #9b9a97;
}

.small-refresh {
    border: 0;
    background: transparent;

    color: #787774;

    cursor: pointer;
}

.small-refresh:hover {
    color: #37352f;
}

.error {
    min-height: 18px;

    margin-top: 10px;

    color: #d44c47;

    font-size: 12px;
    text-align: center;
}

/* ============================
   Responsive
============================ */

@media (max-width: 700px) {

    body {
        padding: 6px;
    }

    .app {
        padding: 16px;
    }

    .columns {
        grid-template-columns: 1fr;
        gap: 28px;
    }

    .left-panel {
        padding-right: 0;
        padding-bottom: 28px;

        border-right: 0;
        border-bottom: 1px solid #e9e9e7;
    }
}

@media (max-width: 430px) {

    .favorite-item {
        grid-template-columns:
            1fr
            auto
            1fr
            30px;
    }

    .favorite-rate {
        grid-column: 1 / 4;

        text-align: left;

        padding: 4px 2px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="title">
        💱 Currency
    </div>

    <div class="columns">

        <!-- =====================
             LEFT
        ====================== -->

        <section class="panel left-panel">

            <div class="panel-title">
                Currency Converter
            </div>

            <label class="label">
                Amount
            </label>

            <input
                id="amount"
                type="number"
                value="1000"
                min="0"
                step="any"
            >

            <div class="currency-row">

                <div>

                    <label class="label">
                        From
                    </label>

                    <select id="fromCurrency"></select>

                </div>

                <button
                    id="swapButton"
                    class="swap-button"
                    type="button"
                    title="Swap currencies"
                >
                    ⇄
                </button>

                <div>

                    <label class="label">
                        To
                    </label>

                    <select id="toCurrency"></select>

                </div>

            </div>

            <div class="result">

                <div class="result-label">
                    Converted Amount
                </div>

                <div
                    id="resultValue"
                    class="result-value"
                >
                    --
                </div>

                <div
                    id="rateValue"
                    class="rate"
                >
                    --
                </div>

            </div>

            <button
                id="refreshButton"
                class="refresh-button"
                type="button"
            >
                ↻ Refresh Rate
            </button>

            <div
                id="converterError"
                class="error"
            ></div>

        </section>


        <!-- =====================
             RIGHT
        ====================== -->

        <section class="panel">

            <div class="panel-title">
                Favorite Rates
            </div>

            <div
                id="favoriteList"
                class="favorite-list"
            ></div>

            <button
                id="addRateButton"
                class="add-button"
                type="button"
            >
                ＋ Add Rate
            </button>

            <div class="favorite-footer">

                <span id="updateTime">
                    --
                </span>

                <button
                    id="favoriteRefresh"
                    class="small-refresh"
                    type="button"
                >
                    ↻ Refresh
                </button>

            </div>

            <div
                id="favoriteError"
                class="error"
            ></div>

        </section>

    </div>

</div>


<script>

/* ==================================================
   Configuration
================================================== */

const API_BASE =
    "https://open.er-api.com/v6/latest";


const currencies = {

    TWD: {
        name: "New Taiwan Dollar",
        symbol: "NT$"
    },

    USD: {
        name: "US Dollar",
        symbol: "$"
    },

    JPY: {
        name: "Japanese Yen",
        symbol: "¥"
    },

    EUR: {
        name: "Euro",
        symbol: "€"
    },

    HKD: {
        name: "Hong Kong Dollar",
        symbol: "HK$"
    },

    MOP: {
        name: "Macanese Pataca",
        symbol: "MOP$"
    },

    CNY: {
        name: "Chinese Yuan",
        symbol: "CN¥"
    },

    KRW: {
        name: "South Korean Won",
        symbol: "₩"
    },

    GBP: {
        name: "British Pound",
        symbol: "£"
    },

    SGD: {
        name: "Singapore Dollar",
        symbol: "S$"
    },

    AUD: {
        name: "Australian Dollar",
        symbol: "A$"
    },

    CAD: {
        name: "Canadian Dollar",
        symbol: "C$"
    },

    THB: {
        name: "Thai Baht",
        symbol: "฿"
    },

    MYR: {
        name: "Malaysian Ringgit",
        symbol: "RM"
    }

};


/* ==================================================
   DOM
================================================== */

const amountInput =
    document.getElementById("amount");

const fromCurrency =
    document.getElementById("fromCurrency");

const toCurrency =
    document.getElementById("toCurrency");

const resultValue =
    document.getElementById("resultValue");

const rateValue =
    document.getElementById("rateValue");

const refreshButton =
    document.getElementById("refreshButton");

const swapButton =
    document.getElementById("swapButton");

const converterError =
    document.getElementById("converterError");


const favoriteList =
    document.getElementById("favoriteList");

const addRateButton =
    document.getElementById("addRateButton");

const favoriteRefresh =
    document.getElementById("favoriteRefresh");

const favoriteError =
    document.getElementById("favoriteError");

const updateTime =
    document.getElementById("updateTime");


/* ==================================================
   API cache

   如果 Favorite 裡面有：

   TWD → USD
   TWD → JPY
   TWD → HKD

   只需要 Call 一次：

   /latest/TWD

================================================== */

const rateCache = new Map();


async function getRates(base, force = false) {

    if (
        !force &&
        rateCache.has(base)
    ) {
        return rateCache.get(base);
    }


    const response =
        await fetch(
            `${API_BASE}/${encodeURIComponent(base)}`,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}`
        );

    }


    const data =
        await response.json();


    if (
        data.result &&
        data.result !== "success"
    ) {

        throw new Error(
            data["error-type"] ||
            "API Error"
        );

    }


    if (!data.rates) {

        throw new Error(
            "No exchange rates returned"
        );

    }


    rateCache.set(
        base,
        data
    );


    return data;
}


/* ==================================================
   Formatting
================================================== */

function formatAmount(value) {

    return new Intl.NumberFormat(
        "zh-TW",
        {
            maximumFractionDigits: 2
        }
    ).format(value);

}


function formatRate(value) {

    let digits = 6;


    if (value >= 100) {

        digits = 2;

    }
    else if (value >= 1) {

        digits = 4;

    }


    return new Intl.NumberFormat(
        "zh-TW",
        {
            maximumFractionDigits: digits
        }
    ).format(value);

}


/* ==================================================
   Currency selects
================================================== */

function fillSelect(select) {

    select.innerHTML = "";


    Object.entries(currencies)
        .forEach(([code, currency]) => {

            const option =
                document.createElement("option");

            option.value = code;

            option.textContent =
                `${code} - ${currency.name}`;

            select.appendChild(option);

        });

}


fillSelect(fromCurrency);
fillSelect(toCurrency);


/* ==================================================
   Settings
================================================== */

function loadConverterSettings() {

    try {

        fromCurrency.value =
            localStorage.getItem(
                "converterFrom"
            ) || "TWD";


        toCurrency.value =
            localStorage.getItem(
                "converterTo"
            ) || "USD";

    }
    catch {

        fromCurrency.value = "TWD";
        toCurrency.value = "USD";

    }

}


function saveConverterSettings() {

    try {

        localStorage.setItem(
            "converterFrom",
            fromCurrency.value
        );

        localStorage.setItem(
            "converterTo",
            toCurrency.value
        );

    }
    catch {}

}


/* ==================================================
   Converter
================================================== */

async function convertCurrency(force = false) {

    converterError.textContent = "";


    const amount =
        parseFloat(amountInput.value);

    const from =
        fromCurrency.value;

    const to =
        toCurrency.value;


    if (
        Number.isNaN(amount) ||
        amount < 0
    ) {

        resultValue.textContent = "--";

        rateValue.textContent = "--";

        converterError.textContent =
            "請輸入有效金額";

        return;

    }


    saveConverterSettings();


    if (from === to) {

        resultValue.textContent =
            `${currencies[to].symbol} ${formatAmount(amount)}`;

        rateValue.textContent =
            `1 ${from} = 1 ${to}`;

        return;

    }


    refreshButton.disabled = true;

    refreshButton.textContent =
        "Updating...";


    try {

        const data =
            await getRates(
                from,
                force
            );


        const rate =
            data.rates[to];


        if (rate == null) {

            throw new Error(
                `${to} unavailable`
            );

        }


        const converted =
            amount * rate;


        resultValue.textContent =
            `${currencies[to].symbol} ${formatAmount(converted)}`;


        rateValue.textContent =
            `1 ${from} = ${formatRate(rate)} ${to}`;

    }
    catch (error) {

        console.error(error);

        resultValue.textContent = "--";

        rateValue.textContent = "--";

        converterError.textContent =
            `無法取得 ${from} → ${to} 匯率`;

    }
    finally {

        refreshButton.disabled = false;

        refreshButton.textContent =
            "↻ Refresh Rate";

    }

}


/* ==================================================
   Favorites
================================================== */

const DEFAULT_FAVORITES = [

    {
        from: "TWD",
        to: "USD"
    },

    {
        from: "TWD",
        to: "JPY"
    },

    {
        from: "USD",
        to: "TWD"
    },

    {
        from: "MOP",
        to: "TWD"
    }

];


let favorites = [];


function loadFavorites() {

    try {

        const saved =
            localStorage.getItem(
                "favoriteRates"
            );


        if (saved) {

            favorites =
                JSON.parse(saved);

        }
        else {

            favorites =
                structuredClone(
                    DEFAULT_FAVORITES
                );

        }

    }
    catch {

        favorites =
            DEFAULT_FAVORITES.map(
                item => ({ ...item })
            );

    }

}


function saveFavorites() {

    try {

        localStorage.setItem(
            "favoriteRates",
            JSON.stringify(favorites)
        );

    }
    catch {}

}


/* ==================================================
   Favorite UI
================================================== */

function createCurrencySelect(
    value,
    changeHandler
) {

    const select =
        document.createElement("select");


    Object.keys(currencies)
        .forEach(code => {

            const option =
                document.createElement("option");

            option.value = code;

            option.textContent = code;

            option.selected =
                code === value;

            select.appendChild(option);

        });


    select.addEventListener(
        "change",
        changeHandler
    );


    return select;
}


function renderFavorites() {

    favoriteList.innerHTML = "";


    if (favorites.length === 0) {

        const empty =
            document.createElement("div");

        empty.style.color =
            "#9b9a97";

        empty.style.fontSize =
            "13px";

        empty.style.padding =
            "20px 5px";

        empty.style.textAlign =
            "center";

        empty.textContent =
            "尚未加入常用匯率";

        favoriteList.appendChild(
            empty
        );

        return;

    }


    favorites.forEach(
        (favorite, index) => {

            const row =
                document.createElement("div");

            row.className =
                "favorite-item";


            /* FROM */

            const fromSelect =
                createCurrencySelect(
                    favorite.from,
                    () => {

                        favorites[index].from =
                            fromSelect.value;

                        saveFavorites();

                        refreshFavorites();

                    }
                );


            /* Arrow */

            const arrow =
                document.createElement("span");

            arrow.className =
                "arrow";

            arrow.textContent =
                "→";


            /* TO */

            const toSelect =
                createCurrencySelect(
                    favorite.to,
                    () => {

                        favorites[index].to =
                            toSelect.value;

                        saveFavorites();

                        refreshFavorites();

                    }
                );


            /* Rate */

            const rate =
                document.createElement("div");

            rate.className =
                "favorite-rate";

            rate.dataset.rateIndex =
                index;

            rate.textContent =
                "--";


            /* Delete */

            const remove =
                document.createElement("button");

            remove.type =
                "button";

            remove.className =
                "delete-button";

            remove.title =
                "Remove";

            remove.textContent =
                "×";


            remove.addEventListener(
                "click",
                () => {

                    favorites.splice(
                        index,
                        1
                    );

                    saveFavorites();

                    renderFavorites();

                    refreshFavorites();

                }
            );


            row.append(
                fromSelect,
                arrow,
                toSelect,
                rate,
                remove
            );


            favoriteList.appendChild(
                row
            );

        });

}


/* ==================================================
   Refresh Favorites

   Group requests by base currency.
================================================== */

async function refreshFavorites(
    force = false
) {

    favoriteError.textContent = "";


    if (favorites.length === 0) {

        updateTime.textContent = "";

        return;

    }


    favoriteRefresh.disabled = true;

    favoriteRefresh.textContent =
        "Updating...";


    try {

        /*
         * Unique base currencies
         */

        const bases =
            [
                ...new Set(
                    favorites.map(
                        item => item.from
                    )
                )
            ];


        /*
         * Fetch all base rates
         */

        const responses =
            await Promise.all(

                bases.map(
                    async base => {

                        const data =
                            await getRates(
                                base,
                                force
                            );

                        return [
                            base,
                            data
                        ];

                    }
                )

            );


        const ratesByBase =
            new Map(responses);


        /*
         * Update each row
         */

        favorites.forEach(
            (favorite, index) => {

                const element =
                    document.querySelector(
                        `[data-rate-index="${index}"]`
                    );


                if (!element) {
                    return;
                }


                if (
                    favorite.from ===
                    favorite.to
                ) {

                    element.textContent =
                        "1";

                    return;

                }


                const data =
                    ratesByBase.get(
                        favorite.from
                    );


                const rate =
                    data?.rates?.[
                        favorite.to
                    ];


                if (rate == null) {

                    element.textContent =
                        "--";

                    return;

                }


                element.textContent =
                    formatRate(rate);

            });


        updateTime.textContent =
            `Updated ${new Date().toLocaleTimeString(
                "zh-TW",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}`;

    }
    catch (error) {

        console.error(error);

        favoriteError.textContent =
            "部分匯率更新失敗";

    }
    finally {

        favoriteRefresh.disabled = false;

        favoriteRefresh.textContent =
            "↻ Refresh";

    }

}


/* ==================================================
   Add favorite
================================================== */

function addFavorite() {

    /*
     * Default to TWD → USD.
     *
     * User can immediately change
     * both dropdowns.
     */

    favorites.push({

        from: "TWD",
        to: "USD"

    });


    saveFavorites();

    renderFavorites();

    refreshFavorites();

}


/* ==================================================
   Events
================================================== */

swapButton.addEventListener(
    "click",
    () => {

        const old =
            fromCurrency.value;

        fromCurrency.value =
            toCurrency.value;

        toCurrency.value =
            old;

        convertCurrency();

    }
);


refreshButton.addEventListener(
    "click",
    () => {

        rateCache.delete(
            fromCurrency.value
        );

        convertCurrency(true);

    }
);


favoriteRefresh.addEventListener(
    "click",
    () => {

        /*
         * Clear cache so this is a
         * real refresh.
         */

        rateCache.clear();

        refreshFavorites(true);

    }
);


addRateButton.addEventListener(
    "click",
    addFavorite
);


fromCurrency.addEventListener(
    "change",
    () => {

        saveConverterSettings();

        convertCurrency();

    }
);


toCurrency.addEventListener(
    "change",
    () => {

        saveConverterSettings();

        convertCurrency();

    }
);


/* Amount debounce */

let amountTimer;


amountInput.addEventListener(
    "input",
    () => {

        clearTimeout(
            amountTimer
        );


        amountTimer =
            setTimeout(
                () => {

                    convertCurrency();

                },
                300
            );

    }
);


amountInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            clearTimeout(
                amountTimer
            );

            convertCurrency();

        }

    }
);


/* ==================================================
   Start
================================================== */

loadConverterSettings();

loadFavorites();

renderFavorites();

convertCurrency();

refreshFavorites();

</script>

</body>
</html>
